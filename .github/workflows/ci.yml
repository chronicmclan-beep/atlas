name: CI

# Runs on every push and pull request to main. If data validation, the smoke
# tests, or the production build fail, the run is marked with a red ✗ so a
# broken change is caught before it becomes the live version.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate data files
        run: npm run validate
      - name: Lint code
        run: npm run lint
      - name: Smoke tests (all six sections render)
        run: npm test
      - name: Production build
        run: npm run build
