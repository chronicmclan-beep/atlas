name: Deploy to GitHub Pages

# Builds the Vite site and publishes dist/ to GitHub Pages.
# Auto-deploys on every push to main (plus a manual trigger in the Actions tab).
# NOTE: runs will fail until GitHub Pages is enabled for this repo
# (Settings → Pages → Source: GitHub Actions).
# Assumes this repository's root is the atlas/ project (package.json at root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Project pages live at user.github.io/<repo>/, so the base must be /<repo>/.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
