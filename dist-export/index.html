h flow",type:"term",definition:"Cash left after operating the business and buying equipment — the money genuinely free to reinvest or return to shareholders."},{id:"operating-cash-flow",term:"Operating cash flow",type:"term",definition:"Cash generated by the core business before capital spending."},{id:"diluted-eps",term:"Diluted EPS",type:"term",definition:"Profit divided by share count, including shares that stock options could create. The per-share figure most tied to the stock price."},{id:"non-gaap-eps",term:"Non-GAAP EPS",type:"term",definition:"A company-adjusted per-share profit that strips out items like stock compensation and acquisition costs. Higher than GAAP, useful but not standardized."},{id:"data-center-revenue",term:"Data center revenue",type:"term",definition:"Revenue from AI and server chips specifically — the segment driving the current buildout."},{id:"dcai-revenue",term:"DCAI revenue",type:"term",definition:"Intel's Data Center and AI segment — its server and AI-chip business."},{id:"foundry-revenue",term:"Foundry revenue",type:"term",definition:"Revenue from a chip-manufacturing arm. For Intel, mostly internal transfers, so it overstates the external business."},{id:"rd-spend",term:"R&D spend",type:"term",definition:"What the company spent developing new chips and technology. Runs high for designers competing at the leading edge."},{id:"adjusted-ebitda",term:"Adjusted EBITDA",type:"term",definition:"Earnings before interest, tax, depreciation, and amortization, with some items adjusted out. A rough proxy for cash profitability that ignores capital costs."},{id:"ai-semi-revenue",term:"AI semi revenue",type:"term",definition:"AI-specific chip revenue — custom accelerators and networking silicon built for hyperscalers."},{id:"royalty-revenue",term:"Royalty revenue",type:"term",definition:"For Arm, per-chip fees earned on every chip shipped using its designs. Recurring and high-margin."},{id:"licensing-revenue",term:"Licensing revenue",type:"term"  one of the partners in the $500B Stargate infrastructure commitment.",source:"press"},{id:"humain",term:"HUMAIN",type:"player",definition:"Saudi Arabia's PIF-backed national AI champion, unveiled in May 2025 with NVIDIA to build large-scale (500 MW+) AI data centers — a flagship of sovereign AI.",source:"HUMAIN / NVIDIA"},{id:"g42",term:"G42",type:"player",definition:"The UAE's state-linked AI firm, a hub of Gulf sovereign-AI ambitions and a cleared recipient of advanced-chip exports (up to ~70,000 Blackwell GPUs alongside HUMAIN).",source:"press / US Commerce"},{id:"euv-lithography",term:"EUV lithography machines",type:"product",definition:"Extreme-ultraviolet lithography — the machines that print the finest features on a chip. ASML is the sole maker, and TSMC uses them to fabricate leading-edge AI silicon. The single hardest chokepoint in the whole chain.",source:"ASML / TSMC"},{id:"h100-h200",term:"NVIDIA H100 / H200",type:"product",definition:"NVIDIA's Hopper-generation data-center GPUs — the H100, and the higher-memory H200 — that powered the first wave of the AI boom. Their ramp drove NVIDIA's 2023 demand-signal quarter.",source:"NVIDIA"},{id:"blackwell",term:"Blackwell",type:"product",definition:"NVIDIA's GPU architecture unveiled in March 2024 (GB200 and successors) — the next-generation accelerators the whole supply chain raced to build, filling the giant new data-center campuses.",source:"NVIDIA"},{id:"vera-rubin",term:"Vera Rubin",type:"product",definition:"NVIDIA's next accelerator platform after Blackwell on its public roadmap, named for the astronomer — signalling the near-annual cadence of ever-more-powerful (and power-hungry) AI chips.",source:"NVIDIA"},{id:"hbm",term:"HBM",type:"product",definition:"High-bandwidth memory — DRAM stacked in a tower and placed right next to an AI accelerator. Supplied mainly by SK Hynix, with Micron and Samsung. The genuine bottleneck on how many accelerators can ship.",source:"company disclosures"},{id:"cowos",term:"CoWoS",type:"product",definition:"Chip-on-Wafer-on-Substrate — TSMC's advanced packaging that fuses logic and HBM memory into one finished accelerator. Its limited capacity is a key chokepoint everyone queues for.",source:"TSMC"},{id:"deepseek-shock",term:"The DeepSeek shock",type:"event",definition:"On January 27, 2025, a low-cost Chinese model from DeepSeek triggered NVIDIA's ~$600B single-day market-value drop — the largest in market history — and the first serious scare that AI might need far less compute than assumed.",source:"press"},{id:"circular-financing",term:"Circular financing",type:"event",definition:"The pattern where a chip vendor invests in — or finances — a customer that then uses the money to buy that vendor's chips (e.g. NVIDIA's commitments tied to OpenAI; AMD's warrants tied to OpenAI's GPU deployment). Critics warn it can inflate apparent demand.",source:"SEC filings / press"},{id:"demand-signal-quarter",term:"The demand-signal quarter",type:"event",definition:"NVIDIA's May 2023 earnings, when it guided revenue far above expectations (~$11B) and the stock jumped ~24% — the first hard proof in the financials that AI demand was real.",source:"NVIDIA 8-K"},{id:"chatgpt-launch",term:"ChatGPT launches",type:"event",definition:"OpenAI's chatbot launched November 30, 2022 and reached ~100M users in two months — the consumer moment that turned AI into a global demand shock the whole chain now serves.",source:"OpenAI"},{id:"stargate",term:"Stargate",type:"event",definition:"A $500B, four-year AI-infrastructure commitment announced January 2025 by OpenAI, SoftBank, Oracle and MGX — the largest single AI build-out plan yet, announced at the White House.",source:"OpenAI"},{id:"coreweave-ipo",term:"CoreWeave IPO",type:"event",definition:"The first big neocloud to go public (March 2025, Nasdaq) — validating the GPU-rental model and its tight ties to NVIDIA, which holds roughly a 12% stake (after a $2B follow-on purchase, Jan 2026).",source:"CoreWeave"},{id:"
